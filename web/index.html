<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>Sauron — bosbranddetectie</title>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #121214;
    --panel2: #18181b;
    --ink: #ececef;
    --body: #b9b9c0;
    --mute: #7c7c85;
    --dim: #55555e;
    --hair: rgba(255, 255, 255, .09);
    --hair-strong: rgba(255, 255, 255, .2);
    --danger: #ff453a;
    --success: #32d74b;
    --warning: #ff9f0a;
    --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Monaco,
            Consolas, "Liberation Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button { font: inherit; color: inherit; }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */
  .top {
    flex: 0 0 auto;
    height: 48px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--hair-strong);
  }

  .top .name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .24em;
  }

  .head-right { display: flex; align-items: center; gap: 12px; }

  #new-flight { padding: 4px 10px; }

  /* ---------- warning strip ---------- */
  .warning {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 7px 16px;
    border-bottom: 1px solid rgba(255, 159, 10, .35);
    background: rgba(255, 159, 10, .07);
    color: var(--warning);
    font-size: 11px;
  }
  .warning[hidden] { display: none; }
  .warning .tag { font-weight: 600; }

  /* ---------- layout: cameras on top, results below ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
  }

  .camrow {
    flex: 1.45 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .resultrow {
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 0;
    overflow: hidden;
  }

  .camrow .panel.camera { flex: 0 0 auto; }

  .phead {
    flex: 0 0 auto;
    height: 32px;
    padding: 0 11px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid var(--hair);
  }

  .phead .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }
  .phead .label .br { color: var(--dim); font-weight: 400; }

  .phead .meta {
    font-size: 10px;
    color: var(--mute);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .phead .meta.alert { color: var(--danger); }

  .status {
    flex-shrink: 0;
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border: 1px solid var(--hair);
    border-radius: 4px;
    white-space: nowrap;
  }
  .status.live { color: var(--success); border-color: rgba(50, 215, 75, .35); }
  .status.stale { color: var(--warning); border-color: rgba(255, 159, 10, .4); }
  .status.idle { color: var(--mute); }

  .camera-body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    padding: 8px;
  }

  .frame {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    background: #060607;
    border: 1px solid var(--hair);
    overflow: hidden;
  }

  .frame-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 16px;
    text-align: center;
    font-size: 11px;
    color: var(--mute);
  }
  .frame-empty[hidden] { display: none; }
  .frame-empty .u { font-size: 10px; color: var(--dim); }

  #thermal {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  #rgb {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 7px;
    border: 1px solid var(--hair);
    border-radius: 4px;
    background: transparent;
    color: var(--body);
    font-size: 10px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .btn:hover { background: var(--panel2); border-color: var(--hair-strong); }
  .btn:active { background: #202024; }

  /* ---------- telemetry ---------- */
  .tbody {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .tele-body { padding: 10px 12px; gap: 6px; overflow-y: auto; }

  .agl-hero {
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--hair);
  }
  .hero-num {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .hero-num.warn { color: var(--warning); }
  .hero-unit {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .hero-sub {
    margin-left: auto;
    font-size: 10px;
    color: var(--mute);
    font-variant-numeric: tabular-nums;
  }

  .kv { display: flex; flex-direction: column; }
  .kv > div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 3px 0;
    border-bottom: 1px solid var(--hair);
  }
  .kv dt {
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--mute);
    white-space: nowrap;
  }
  .kv dd {
    font-size: 11px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sysrow {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
    padding-top: 5px;
  }
  .sysrow .chip {
    font-size: 9px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--mute);
    border: 1px solid var(--hair);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .sysrow .chip.on { color: var(--warning); border-color: rgba(255, 159, 10, .35); }

  /* ---------- fires ---------- */
  .fire-body { padding: 4px; }

  .fire-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .empty {
    padding: 24px 12px;
    text-align: center;
    font-size: 11px;
    color: var(--mute);
  }

  .fire {
    flex: 0 0 auto;
    border: 1px solid transparent;
    border-radius: 4px;
  }
  .fire.open { background: var(--panel2); border-color: var(--hair); }
  .fire.lost { opacity: .62; }
  .fire.lost .ftemp { color: var(--mute); }
  .fire.lost .fid { color: var(--dim); }

  .fire-head {
    width: 100%;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    padding: 8px;
    background: transparent;
    border: 0;
    border-radius: 4px;
    text-align: left;
    cursor: pointer;
  }
  .fire-head:hover { background: var(--panel2); }
  .fire.open .fire-head:hover { background: transparent; }

  .fid {
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--mute);
    white-space: nowrap;
  }
  .fid .mark { color: var(--danger); }

  .fmain { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .ftemp {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.05;
    color: var(--danger);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .ftemp .u { font-size: 10px; font-weight: 400; color: var(--mute); }
  .fmeta {
    font-size: 10px;
    color: var(--body);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .fdist {
    font-size: 10px;
    color: var(--mute);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .fire-detail {
    padding: 6px 8px 8px;
    border-top: 1px solid var(--hair);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 14px;
  }
  .fire-detail[hidden] { display: none; }

  .fd {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-size: 10px;
    padding: 1px 0;
  }
  .fd .k { color: var(--mute); }
  .fd .v { color: var(--ink); font-variant-numeric: tabular-nums; }

  .reasons {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-top: 5px;
    font-size: 9px;
    letter-spacing: .04em;
    color: var(--dim);
  }
  .reasons .ok { color: var(--success); }

  .fire-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    margin-top: 5px;
  }

  /* ---------- logs ---------- */
  .log-body { padding: 4px 0 5px; }

  .log-box {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0 11px;
    font-size: 11px;
    line-height: 1.55;
  }

  .log-line {
    display: grid;
    grid-template-columns: 50px 15px minmax(0, 1fr);
    gap: 5px;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .05);
  }
  .log-line .t {
    font-size: 9px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .log-line .tag { font-size: 10px; color: var(--dim); }
  .log-line .m { color: var(--body); overflow-wrap: anywhere; }
  .log-line.fire .tag,
  .log-line.fire .m { color: var(--danger); }

  /* scrollbars */
  .fire-list, .log-box, .tele-body {
    scrollbar-width: thin;
    scrollbar-color: var(--hair) transparent;
  }
  .fire-list::-webkit-scrollbar,
  .log-box::-webkit-scrollbar,
  .tele-body::-webkit-scrollbar { width: 4px; }
  .fire-list::-webkit-scrollbar-thumb,
  .log-box::-webkit-scrollbar-thumb,
  .tele-body::-webkit-scrollbar-thumb {
    background: var(--hair);
    border-radius: 2px;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) {
    .resultrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .logs { grid-column: 1 / -1; }
  }

  @media (max-width: 760px) {
    html, body { height: auto; overflow: auto; }
    .app { height: auto; min-height: 100dvh; }
    .top { height: auto; padding: 8px 12px; flex-wrap: wrap; gap: 8px; }
    main { padding: 8px; gap: 8px; }
    .camrow { flex: 0 0 auto; flex-direction: column; align-items: stretch; }
    .camrow .panel.camera { width: 100%; height: auto; }
    .camera-body { display: block; }
    .camera-body .frame { width: 100%; height: auto; aspect-ratio: 4 / 3; }
    .camera.rgb .frame { aspect-ratio: 16 / 9; }
    .resultrow { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .fires { min-height: 340px; }
    .telemetry { min-height: 320px; }
    .logs { min-height: 240px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="name">SAURON</span>
    <div class="head-right">
      <span class="status idle" id="status" role="status" aria-live="polite">[ ] niet verbonden</span>
      <button class="btn" id="new-flight" type="button">[nieuwe vlucht]</button>
    </div>
  </header>

  <div class="warning" id="warning" hidden>
    <span class="tag">[!]</span>
    <span id="warning-text"></span>
  </div>

  <main>
    <!-- cameras: boxes sized to their native aspect ratios -->
    <div class="camrow" id="camrow">
      <section class="panel camera thermal" id="thermal-panel" aria-labelledby="thermal-title">
        <div class="phead">
          <span class="label" id="thermal-title"><span class="br">[+]</span> thermisch</span>
          <span class="meta">MLX90640 · 32×24</span>
        </div>
        <div class="camera-body">
          <div class="frame">
            <canvas id="thermal" width="320" height="240"
                    aria-label="Thermisch beeld, 32 bij 24 pixels"></canvas>
            <div class="frame-empty" id="thermal-empty">[ ] geen thermisch frame</div>
          </div>
        </div>
      </section>

      <section class="panel camera rgb" id="rgb-panel" aria-labelledby="rgb-title">
        <div class="phead">
          <span class="label" id="rgb-title"><span class="br">[+]</span> rgb</span>
          <span class="meta">
            <button class="btn" id="rgb-reload" type="button" title="stream herladen">[↻]</button>
          </span>
        </div>
        <div class="camera-body">
          <div class="frame" id="rgb-frame">
            <img id="rgb" alt="RGB-stream van de drone">
            <div class="frame-empty" id="rgb-fb">
              <span>[ ] geen RGB-stream</span>
              <span class="u" id="rgb-url"></span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- results -->
    <div class="resultrow">
      <section class="panel fires" aria-labelledby="fires-title">
        <div class="phead">
          <span class="label" id="fires-title"><span class="br">[+]</span> branden</span>
          <span class="meta" id="fires-badge">[0]</span>
        </div>
        <div class="tbody fire-body">
          <div class="fire-list" id="fire-list"></div>
        </div>
      </section>

      <section class="panel telemetry" aria-labelledby="tele-title">
        <div class="phead">
          <span class="label" id="tele-title"><span class="br">[+]</span> telemetrie</span>
          <span class="meta" id="fix-badge">—</span>
        </div>
        <div class="tbody tele-body">
          <div class="agl-hero">
            <span class="hero-num" id="d-agl">—</span>
            <span class="hero-unit">m agl</span>
            <span class="hero-sub"><span id="d-msl">—</span> m msl</span>
          </div>
          <dl class="kv">
            <div><dt>positie</dt><dd id="d-pos">—</dd></div>
            <div><dt>heading</dt><dd id="d-heading">—</dd></div>
            <div><dt>gps</dt><dd id="d-gps">—</dd></div>
            <div><dt>max</dt><dd id="t-max">—</dd></div>
            <div><dt>omgeving</dt><dd id="t-amb">—</dd></div>
            <div><dt>drempel</dt><dd id="t-thr">—</dd></div>
          </dl>
          <div class="sysrow">
            <span class="chip" id="sys-mode">—</span>
            <span class="chip" id="sys-bat" hidden></span>
            <span class="chip" id="sys-auto" hidden></span>
          </div>
        </div>
      </section>

      <section class="panel logs" aria-labelledby="logs-title">
        <div class="phead">
          <span class="label" id="logs-title"><span class="br">[+]</span> logboek</span>
          <span class="meta" id="log-badge">[0]</span>
        </div>
        <div class="tbody log-body">
          <div class="log-box" id="log-box"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const canvas = $("thermal");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const CW = W / 32;
  const CH = H / 24;

  const thermalPanel = $("thermal-panel");
  const rgbPanel = $("rgb-panel");
  const rgbFrame = $("rgb-frame");
  const camrow = $("camrow");

  const STOPS = [
    [11, 26, 51],
    [30, 79, 156],
    [179, 64, 47],
    [255, 159, 10],
    [255, 244, 214],
  ];

  let currentFires = [];
  let expandedKey = null;
  let lastFiresKey = null;
  let lastLogKey = null;
  let rgbUrl = null;
  let rgbAspect = 16 / 9;   // fallback tot de stream zich meldt
  let warningShown = false;

  function kleur(t) {
    t = Math.max(0, Math.min(1, t));
    const x = t * (STOPS.length - 1);
    const i = Math.min(Math.floor(x), STOPS.length - 2);
    const f = x - i;
    const a = STOPS[i];
    const b = STOPS[i + 1];
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)},`
         + `${Math.round(a[1] + (b[1] - a[1]) * f)},`
         + `${Math.round(a[2] + (b[2] - a[2]) * f)})`;
  }

  function fmt(v, d = 1, suffix = "") {
    if (v == null || Number.isNaN(Number(v))) return "—";
    return Number(v).toFixed(d) + suffix;
  }

  function ageText(seconds) {
    if (seconds == null) return "—";
    if (seconds < 1) return "<1 s";
    if (seconds < 60) return Math.round(seconds) + " s";
    return Math.floor(seconds / 60) + " min";
  }

  function clock(epoch) {
    if (!epoch) return "--:--:--";
    return new Date(epoch * 1000).toTimeString().slice(0, 8);
  }

  // ---------- camera box sizing ----------
  // Beide cameras krijgen de grootst mogelijke box met hun eigen
  // beeldverhouding (thermisch 32x24 = 4:3, RGB uit de stream).
  function layoutCameras() {
    if (window.innerWidth <= 760) {
      thermalPanel.style.width = "";
      thermalPanel.style.height = "";
      rgbPanel.style.width = "";
      rgbPanel.style.height = "";
      return;
    }

    const arT = 4 / 3;
    const arR = rgbAspect || 16 / 9;
    const gap = 10;
    const chromeX = 18;   // 16 padding + 2 border per paneel
    const chromeY = 50;   // 32 header + 16 padding + 2 border
    const availW = camrow.clientWidth;
    const availH = camrow.clientHeight;
    if (availW < 240 || availH < 140) return;

    const frameH = Math.min(
      availH - chromeY,
      (availW - gap - chromeX * 2) / (arT + arR)
    );
    if (frameH <= 0) return;

    thermalPanel.style.width = (frameH * arT + chromeX) + "px";
    thermalPanel.style.height = (frameH + chromeY) + "px";
    rgbPanel.style.width = (frameH * arR + chromeX) + "px";
    rgbPanel.style.height = (frameH + chromeY) + "px";
  }

  window.addEventListener("resize", layoutCameras);

  // ---------- status + warning ----------
  function renderStatus(state) {
    const age = state.last_update
      ? Math.max(0, Date.now() / 1000 - state.last_update)
      : null;
    const el = $("status");

    if (age == null) {
      el.className = "status idle";
      el.textContent = "[ ] niet verbonden";
      el.title = "nog geen data ontvangen";
    } else if (age <= 3) {
      el.className = "status live";
      el.textContent = "[●] verbonden";
      el.title = "laatste frame " + ageText(age);
    } else {
      el.className = "status stale";
      el.textContent = "[!] niet verbonden";
      el.title = "laatste frame " + ageText(age);
    }

    const warn = state.warning;
    $("warning").hidden = !warn;
    $("warning-text").textContent = warn || "";
    if (!!warn !== warningShown) {
      warningShown = !!warn;
      requestAnimationFrame(layoutCameras);
    }
  }

  // ---------- thermal ----------
  function drawThermal(cells, thermal) {
    const empty = $("thermal-empty");
    const ok = Array.isArray(cells) && cells.length === 768;

    if (!ok) {
      ctx.fillStyle = "#060607";
      ctx.fillRect(0, 0, W, H);
      empty.hidden = false;
      $("t-max").textContent = "—";
      $("t-amb").textContent = "—";
      $("t-thr").textContent = "—";
      return;
    }
    empty.hidden = true;

    const mn = Math.min(...cells);
    const mx = Math.max(...cells);
    const ambient = thermal && thermal.ambient != null ? thermal.ambient : mn;

    // Vaste, begrensde schaal: ruis wordt niet opgerekt tot een nep-brand,
    // maar een echte uitschieter blijft zichtbaar.
    const lo = ambient - 5;
    const hi = Math.max(mx, ambient + 40);
    const span = Math.max(hi - lo, 0.1);

    for (let y = 0; y < 24; y++) {
      for (let x = 0; x < 32; x++) {
        ctx.fillStyle = kleur((cells[y * 32 + x] - lo) / span);
        ctx.fillRect(x * CW, y * CH, CW, CH);
      }
    }

    // Heetste pixel van elke brand: wit kader, donkere kern.
    for (const f of currentFires) {
      if (f.status !== "active") continue;
      if (f.x == null || f.y == null) continue;
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ececef";
      ctx.strokeRect(f.x * CW + 1, f.y * CH + 1, CW - 2, CH - 2);
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#0b0b0d";
      ctx.strokeRect(f.x * CW + CW / 2 - 1, f.y * CH + CH / 2 - 1, 2, 2);
    }

    $("t-max").textContent = fmt(mx, 1, " °C");
    $("t-amb").textContent = fmt(thermal && thermal.ambient, 1, " °C");
    $("t-thr").textContent = fmt(thermal && thermal.threshold, 1, " °C");
  }

  // ---------- rgb ----------
  function setRgb(url) {
    if (!url || url === rgbUrl) return;
    rgbUrl = url;
    $("rgb-url").textContent = url.replace(/^https?:\/\//, "");
    $("rgb").src = url;
  }

  $("rgb").addEventListener("load", (ev) => {
    $("rgb-fb").hidden = true;
    const img = ev.currentTarget;
    if (img.naturalWidth && img.naturalHeight) {
      rgbAspect = img.naturalWidth / img.naturalHeight;
      rgbFrame.style.aspectRatio = String(rgbAspect);
      layoutCameras();
    }
  });
  $("rgb").addEventListener("error", () => { $("rgb-fb").hidden = false; });
  $("rgb-reload").addEventListener("click", () => {
    if (!rgbUrl) return;
    const sep = rgbUrl.includes("?") ? "&" : "?";
    $("rgb").src = rgbUrl + sep + "t=" + Date.now();
  });

  $("new-flight").addEventListener("click", async () => {
    if (!window.confirm("Nieuwe vlucht starten? De huidige vlucht wordt "
        + "opgeslagen en alle live-data wordt gereset.")) return;
    try {
      const response = await fetch("/api/new-flight", { method: "POST" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      expandedKey = null;
      lastFiresKey = null;
      lastLogKey = null;
      currentFires = [];
      await tick();
    } catch (err) {
      window.alert("Nieuwe vlucht starten mislukte.");
    }
  });

  // ---------- telemetry ----------
  const FIX_LABELS = { 0: "geen fix", 1: "2D", 2: "3D", 3: "3D rtk" };

  function gpsText(d) {
    const parts = [];
    if (d.fc_fix != null) parts.push(FIX_LABELS[d.fc_fix] || String(d.fc_fix));
    if (d.fc_sats != null) parts.push(d.fc_sats + " sat");
    if (d.fc_hdop != null) parts.push(Number(d.fc_hdop).toFixed(1) + " hdop");
    return parts.length ? parts.join(" · ") : "—";
  }

  function renderTelemetry(state) {
    const d = state.drone || {};
    const agl = d.agl_m;

    $("d-agl").textContent = fmt(agl, 1);
    $("d-agl").classList.toggle("warn", agl != null && (agl < 5 || agl > 30));
    $("d-msl").textContent = fmt(d.alt_msl, 1);

    $("d-pos").textContent = (d.lat != null && d.lon != null)
      ? `${Number(d.lat).toFixed(5)}, ${Number(d.lon).toFixed(5)}`
      : "—";
    $("d-heading").textContent = fmt(d.heading_deg, 0, "°");
    $("d-gps").textContent = gpsText(d);

    const badge = $("fix-badge");
    const fixOk = d.fc_fix != null && d.fc_fix >= 2;
    badge.textContent = d.fc_fix == null ? "—" : (fixOk ? "fix ok" : "geen fix");
    badge.className = "meta" + (d.fc_fix != null && !fixOk ? " alert" : "");

    $("sys-mode").textContent = state.mode || "—";

    const bat = state.battery;
    const batEl = $("sys-bat");
    batEl.hidden = !bat;
    if (bat) batEl.textContent = `${Number(bat.voltage_v).toFixed(1)} V · ${bat.percent}%`;

    const autoOn = !!(state.autonomy && state.autonomy.enabled);
    const autoEl = $("sys-auto");
    autoEl.hidden = !autoOn;
    autoEl.textContent = "autonomie aan";
    autoEl.className = "chip" + (autoOn ? " on" : "");
  }

  // ---------- fires ----------
  // Het track-ID is stabiel over frames; temperaturen en coördinaten
  // veranderen elke seconde en zouden een open kaart laten dichtklappen.
  function fireKey(f, i) {
    return f.id || ("B" + (i + 1));
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function renderFires(fires) {
    const key = JSON.stringify(fires);
    if (key === lastFiresKey) return;
    lastFiresKey = key;

    const list = $("fire-list");
    list.textContent = "";
    const count = fires ? fires.length : 0;
    const activeCount = fires
      ? fires.filter((f) => f.status === "active").length : 0;
    $("fires-badge").textContent = "[" + count + "]";
    $("fires-badge").className = "meta" + (activeCount ? " alert" : "");

    if (!fires || count === 0) {
      list.appendChild(el("div", "empty", "[ ] geen branden"));
      expandedKey = null;
      return;
    }

    fires.forEach((f, i) => {
      const fk = fireKey(f, i);
      const open = fk === expandedKey;
      const active = f.status ? f.status === "active" : true;

      const card = el("div", "fire" + (open ? " open" : "")
        + (active ? "" : " lost"));

      const head = el("button", "fire-head");
      head.type = "button";
      head.setAttribute("aria-expanded", String(open));

      head.appendChild(el("span", "fid",
        (active ? "[!] " : "[ ] ") + (f.id || ("B" + (i + 1)))));

      const main = el("span", "fmain");
      const temp = el("span", "ftemp", fmt(f.max_temp, 1));
      temp.appendChild(el("span", "u", "°C"));
      main.appendChild(temp);
      const loc = f.hotspot_lat != null
        ? `${Number(f.hotspot_lat).toFixed(5)}, ${Number(f.hotspot_lon).toFixed(5)}`
        : "locatie onbekend";
      main.appendChild(el("span", "fmeta",
        loc + " · " + clock(f.last_seen)));
      head.appendChild(main);

      head.appendChild(el("span", "fdist",
        f.afstand_m != null ? fmt(f.afstand_m, 1, " m") : "—"));

      head.addEventListener("click", () => {
        expandedKey = open ? null : fk;
        lastFiresKey = null;
        renderFires(currentFires);
      });
      card.appendChild(head);

      if (open) {
        const detail = el("div", "fire-detail");
        const rows = [
          ["status", active ? "in beeld" : "uit beeld"],
          ["laatst", clock(f.last_seen)],
          ["eerste", clock(f.first_seen)],
          ["metingen", String(f.observations)],
          ["stijging", fmt(f.delta_t, 1, " °C")],
          ["score", fmt(f.score, 2)],
          ["pixels", f.area + " px"],
          ["afstand", f.afstand_m != null ? fmt(f.afstand_m, 1, " m") : "—"],
          ["latitude", f.hotspot_lat != null ? Number(f.hotspot_lat).toFixed(6) : "—"],
          ["longitude", f.hotspot_lon != null ? Number(f.hotspot_lon).toFixed(6) : "—"],
        ];
        for (const [k, v] of rows) {
          const row = el("div", "fd");
          row.appendChild(el("span", "k", k));
          row.appendChild(el("span", "v", v));
          detail.appendChild(row);
        }

        const reasons = f.reasons || {};
        const reasonDefs = [
          ["stijging", "stijging_boven_omgeving"],
          ["absoluut warm", "absoluut_warm_genoeg"],
          ["groot genoeg", "groot_genoeg"],
        ];
        const reasonBox = el("div", "reasons");
        for (const [label, field] of reasonDefs) {
          const ok = !!reasons[field];
          reasonBox.appendChild(el("span", ok ? "ok" : "",
            (ok ? "[x] " : "[-] ") + label));
        }
        detail.appendChild(reasonBox);

        if (f.hotspot_lat != null && f.hotspot_lon != null) {
          const actions = el("div", "fire-actions");
          const copy = el("button", "btn", "[kopieer]");
          copy.type = "button";
          copy.addEventListener("click", async () => {
            const text = `${Number(f.hotspot_lat).toFixed(6)}, `
                       + `${Number(f.hotspot_lon).toFixed(6)}`;
            try {
              await navigator.clipboard.writeText(text);
              copy.textContent = "[gekopieerd]";
            } catch (err) {
              copy.textContent = "[selecteer]";
            }
            setTimeout(() => { copy.textContent = "[kopieer]"; }, 1400);
          });
          actions.appendChild(copy);
          detail.appendChild(actions);
        }

        card.appendChild(detail);
      }

      list.appendChild(card);
    });
  }

  // ---------- logs ----------
  function renderLogs(state) {
    const logs = state.logs || [];
    const times = state.log_times || [];
    const key = `${logs.length}|${logs[logs.length - 1] || ""}|`
              + `${times[times.length - 1] || ""}`;
    if (key === lastLogKey) return;
    lastLogKey = key;

    const box = $("log-box");
    $("log-badge").textContent = "[" + logs.length + "]";

    const atBottom =
      box.scrollHeight - box.scrollTop - box.clientHeight < 24;

    box.textContent = "";
    if (logs.length === 0) {
      box.appendChild(el("div", "empty", "[ ] nog geen gebeurtenissen"));
      return;
    }

    logs.forEach((message, i) => {
      const isFire = /brand/i.test(message);
      const line = el("div", "log-line" + (isFire ? " fire" : ""));
      line.appendChild(el("span", "t", clock(times[i])));
      line.appendChild(el("span", "tag", isFire ? "[!]" : "[·]"));
      line.appendChild(el("span", "m", message));
      box.appendChild(line);
    });

    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  // ---------- poll ----------
  async function tick() {
    try {
      const [state, frame] = await Promise.all([
        fetch("/api/state", { cache: "no-store" }).then((r) => r.json()),
        fetch("/api/frame", { cache: "no-store" }).then((r) => r.json()),
      ]);

      currentFires = state.fires || [];

      renderStatus(state);
      drawThermal(frame.cells, state.thermal);
      setRgb(state.rgb_url);
      renderTelemetry(state);
      renderFires(currentFires);
      renderLogs(state);
    } catch (err) {
      const el = $("status");
      el.className = "status stale";
      el.textContent = "[!] geen verbinding";
    }
  }

  layoutCameras();
  requestAnimationFrame(layoutCameras);
  setInterval(tick, 1000);
  tick();
})();
</script>
</body>
</html>
